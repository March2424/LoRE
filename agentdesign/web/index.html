<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Naev 本地化工作台</title>
  <style>
    * { box-sizing: border-box; }
    body { font: 15px/1.55 system-ui, sans-serif; margin: 0; color: #243044; background: #f7f8fa; }
    main { max-width: 980px; margin: 30px auto; padding: 0 16px; }
    h1 { font-size: 27px; } h2 { font-size: 18px; margin-top: 0; }
    section, article { border: 1px solid #d5dbe5; background: white; border-radius: 8px; padding: 15px; margin: 12px 0; }
    article { padding: 10px; }
    button, input, textarea, select { font: inherit; }
    button, input:not([type=checkbox]), select, textarea { border: 1px solid #a8b3c2; border-radius: 4px; padding: 5px 8px; }
    button { background: #eef2f7; cursor: pointer; } button:disabled { cursor: default; opacity: .55; }
    textarea { width: 100%; display: block; margin: 7px 0; min-height: 70px; }
    label { display: block; margin: 3px 0; }
    pre, code { white-space: pre-wrap; overflow-wrap: anywhere; } pre { margin: 5px 0; }
    .row, .compare { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
    .compare > * { flex: 1 1 240px; min-width: 0; }
    .muted { color: #4c5c70; } .error { color: #8e1d1d; }
  </style>
  <script defer src="/workbench.js"></script>
</head>
<body><div id="root"></div></body>
</html>
